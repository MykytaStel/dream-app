name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - chore/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      # Replaces a plain test run rather than adding to it: this executes the
      # same suites and additionally enforces the coverage floor.
      - name: Unit tests with coverage
        run: yarn test:coverage

  # The gap these two close: a green suite says nothing about whether the app
  # compiles. Three times in one working session the build broke where every
  # test was passing — a native module that would not codegen, a Gradle type
  # error, a C++ binding. None of that is reachable from Jest.
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate

      # --immutable so a lockfile that drifted from package.json fails here
      # rather than resolving to something nobody has run locally. The patched
      # react-native-libsodium is applied by resolution, not a postinstall
      # script, so it lands before any native build starts.
      - name: Install dependencies
        run: yarn install --immutable

      # Debug rather than release: it compiles the same native graph, including
      # the C++ that no other check touches, and needs no signing key.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Confirm the patched secretstream binding is compiled in
        run: |
          set -euo pipefail
          # The patch is what makes streamed audio encryption possible. If it
          # ever stops applying, the build still succeeds and the failure
          # surfaces only at runtime, on a user's recording.
          if ! grep -q "crypto_secretstream" \
            node_modules/react-native-libsodium/cpp/react-native-libsodium.cpp; then
            echo "The libsodium patch did not apply." >&2
            exit 1
          fi

  ios:
    name: iOS build
    # macos-15 defaults to Xcode 16.4, and `pod install` dies there with
    # "[Xcodeproj] Unable to find compatibility version string for object
    # version 70" — the project format Xcode 26 writes. The same gem versions
    # generate the Pods project fine on a machine with Xcode 26, so this is the
    # image, not the lockfile.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3.1, not something newer: Gemfile.lock was resolved on this project's
      # local Ruby 2.7 and pins CFPropertyList 3.0.9, which declares ruby < 3.2.
      # Ruby 3.3 fails at `bundle install` before anything is built.
      #
      # The real debt is the lockfile being tied to an end-of-life Ruby. Bumping
      # it means regenerating Gemfile.lock on a modern Ruby, which changes what
      # every developer resolves — a separate change, not a CI detail.
      #
      # Pinned here rather than in a .ruby-version file, which would also switch
      # every local shell to satisfy CI.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@3.6.4 --activate

      - name: Install dependencies
        run: yarn install --immutable

      # Pods are gitignored while Podfile.lock is committed, so the lock is the
      # right cache key: a pod install from cold is several minutes of the most
      # expensive runner we use.
      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: ios
        env:
          LANG: en_US.UTF-8
        run: bundle exec pod install

      # CODE_SIGNING_ALLOWED=NO because this proves the code compiles and links,
      # which needs no certificate. Signing belongs to release, not to a PR.
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/DreamApp.xcworkspace \
            -scheme DreamApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
