apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Release signing comes from the environment so no key material ever sits in
// the repository. When these are unset — which is the case until a keystore
// exists — the release build produces an unsigned artifact instead of falling
// back to the debug key.
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseKeystore = releaseKeystorePath != null && !releaseKeystorePath.isEmpty()

// The version is written in package.json and nowhere else. Read rather than
// copied, so this file cannot fall behind it — which is what happened: every
// copy said 0.6.0 while the newest tag said v0.7.2.
def appVersionName =
    new groovy.json.JsonSlurper().parseText(file("../../package.json").text).version

/**
 * versionCode, derived instead of counted.
 *
 * It has to be an integer that never decreases, and it used to be bumped by
 * hand — which is why Android sat on 39 while iOS sat on 38, two numbers for
 * one build with no way to tell which was right. Deriving it from the version
 * makes them the same number and removes the counter entirely.
 *
 * Ten thousand per major and a hundred per minor, so 0.8.0 is 800 and 1.0.0 is
 * 10000. This only stays monotonic while minor and patch stay under 100, which
 * a test asserts rather than trusting.
 */
def appVersionCode = { ->
    def parts = appVersionName.tokenize('.').collect { it.toInteger() }
    parts[0] * 10000 + parts[1] * 100 + parts[2]
}()

ext {
    // String, not File — see the note in the root build.gradle.
    REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath
    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = file("../../node_modules/react-native-worklets")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // Was an absolute path to one developer's nvm install, which built on that
    // machine and nowhere else — CI caught it on the first run it ever did.
    // NODE_BINARY keeps the escape hatch for launching from an IDE that does
    // not inherit a shell PATH, without pinning the repo to one home directory.
    nodeExecutableAndArgs = [System.getenv('NODE_BINARY') ?: 'node']
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Run R8 on release builds, shrinking and obfuscating the Java and Kotlin
 * bytecode. Off in the React Native template, and off here until the dex was
 * measured: three files, 22.3 MB uncompressed, in an app whose own Java is a
 * few thousand lines. Nearly all of it is library code no path reaches.
 *
 * This only touches the JVM side. The JavaScript is already Hermes bytecode and
 * R8 never sees it, so nothing here can shrink the bundle — and nothing here can
 * break it either.
 *
 * The failure mode is worth stating, because it is not the usual one: R8 removes
 * classes nothing statically references, and everything reached by reflection or
 * from JNI looks exactly like that. A build that succeeds proves nothing. The
 * app has to be run.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.dreamapp"
    defaultConfig {
        applicationId "com.kaleidoscopedreams"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Only defined when a real keystore is supplied. Absent, the release
        // build stays unsigned and says why, rather than quietly using the one
        // below it.
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // This used to read `signingConfigs.debug`, which is the template's
            // default and the single most expensive mistake available here: an
            // app published under the debug key — whose password is the public
            // string 'android' — can never be updated, because Play binds the
            // listing to the signing key forever.
            //
            // Now it signs with a real keystore when one is supplied through the
            // environment, and produces an unsigned artifact otherwise. Unsigned
            // is not a lesser evil, it is the correct outcome: it cannot be
            // installed and cannot be uploaded, so the mistake is impossible to
            // make by accident.
            signingConfig hasReleaseKeystore ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
